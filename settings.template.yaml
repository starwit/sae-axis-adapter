log_level: INFO
redis:
  host: redis
  port: 6379
  stream_id: stream1
  output_stream_prefix: axisadapter
mqtt:
  host: mqtt-broker
  port: 1883
  topic: axis/detections
  qos: 0
  # client_id: axis-adapter
  # username: user
  # password: secret
  # tls:
  #   enabled: true
  #   ca_certs: /path/to/ca.crt
  #   # certfile: /path/to/client.crt
  #   # keyfile: /path/to/client.key
  #   insecure: false
# Resolution of the AXIS camera stream. AXIS bounding boxes are normalized (0..1),
# so downstream consumers need the frame shape to reconstruct pixel coordinates.
frame_shape:
  width: 1920
  height: 1080
  channels: 3
# Maps AXIS class.type values onto SAE (class_id, name) tuples.
class_mapping:
  Car:
    id: 2
    name: car
  Human:
    id: 1
    name: person
  Bus:
    id: 5
    name: bus
  Truck:
    id: 7
    name: truck
  Bike:
    id: 3
    name: bicycle
  Motorcycle:
    id: 4
    name: motorcycle
prometheus_port: 8000
